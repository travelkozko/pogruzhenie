<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Погружение</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500&family=Share+Tech+Mono&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --hud:#8ff4ff;
  --hud-dim:rgba(143,244,255,.55);
  --ink:#eafcff;
  --deep:#03172b;
  --top:0px; /* Telegram + system top inset */
  --bot:0px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--deep);overflow:hidden;color:var(--ink);font-family:Manrope,system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;overflow:hidden;touch-action:none}
#vid,#gl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#vid{transform:scale(1.03)}
#gl{display:none}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(2,18,34,.5),rgba(2,18,34,0) 22%,rgba(2,18,34,0) 72%,rgba(2,18,34,.55))}
#mask{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* ---------- HUD ---------- */
.hud{position:absolute;pointer-events:none;font-family:'Share Tech Mono',monospace;color:var(--hud);text-shadow:0 0 10px rgba(143,244,255,.45)}
.lbl{font-family:Manrope,sans-serif;font-weight:600;font-size:9px;letter-spacing:.22em;color:var(--hud-dim);text-transform:uppercase}
#depth{left:calc(var(--gx) + 22px);top:calc(var(--gy) + 20px)}
#depth .v{font-size:40px;line-height:1;letter-spacing:-.02em}
#depth .v small{font-size:16px;margin-left:3px;color:var(--hud-dim)}
#air{right:calc(var(--gx) + 18px);top:calc(var(--gy) + 16px);width:78px;height:78px}
#air svg{position:absolute;inset:0}
#air .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#air .num b{font-weight:400;font-size:22px;line-height:1}
#air .num i{font-style:normal;font-size:9px;color:var(--hud-dim);margin-top:2px}
#air .lbl{position:absolute;top:84px;width:100%;text-align:center}
#stats{left:calc(var(--gx) + 22px);right:calc(var(--gx) + 22px);bottom:calc(var(--gb) + 26px);display:flex;justify-content:space-between;align-items:flex-end}
#stats .v{font-size:18px;line-height:1.1}
#stats .r{text-align:right}

/* depth scale = future menu */
#scale{position:absolute;left:calc(var(--gx) + 10px);top:calc(var(--gy) + 120px);bottom:calc(var(--gb) + 90px);width:40px;pointer-events:none}
#scale .rail{position:absolute;left:4px;top:0;bottom:0;width:1px;background:linear-gradient(var(--hud-dim),rgba(143,244,255,.08))}
#scale .tick{position:absolute;left:0;display:flex;align-items:center;gap:6px;transform:translateY(-50%);font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--hud-dim)}
#scale .tick:before{content:"";width:9px;height:1px;background:var(--hud-dim)}
#scale .mark{position:absolute;left:0;width:9px;height:9px;border:1px solid var(--hud);border-radius:50%;transform:translate(0,-50%);box-shadow:0 0 8px var(--hud);transition:top .25s}

/* ---------- title ---------- */
#title{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);text-align:center;pointer-events:none;transition:opacity .5s,transform .9s cubic-bezier(.5,0,.2,1),filter .7s}
#title h1{font-family:Unbounded,sans-serif;font-weight:300;font-size:min(7.4vw,34px);letter-spacing:.2em;margin-right:-.2em;color:#fff;text-shadow:0 2px 30px rgba(0,30,60,.55),0 0 2px rgba(0,0,0,.3)}
#title p{margin-top:12px;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:rgba(234,252,255,.8);text-shadow:0 1px 12px rgba(0,20,40,.6)}
#title .line{width:46px;height:1px;margin:16px auto 0;background:rgba(255,255,255,.6)}

#cta{position:absolute;left:0;right:0;bottom:calc(var(--gb) + 92px);display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none;transition:opacity .4s}
#cta .ring{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.75);position:relative}
#cta .ring:before,#cta .ring:after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(255,255,255,.6);animation:pulse 2.4s ease-out infinite}
#cta .ring:after{animation-delay:1.2s}
#cta .ring i{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff}
#cta span{font-size:12px;letter-spacing:.24em;text-transform:uppercase;text-shadow:0 1px 10px rgba(0,20,40,.7)}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.4);opacity:0}}

#demo{position:absolute;left:0;right:0;bottom:calc(var(--bot) + 6px);text-align:center;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(234,252,255,.4);pointer-events:none}

/* after dive placeholder */
#vid2,#vid3{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.01;transform:scale(1.02)}
#next{position:absolute;left:calc(var(--gx) + 112px);right:calc(var(--gx) + 104px);top:calc(var(--gy) + 16px);text-align:center;opacity:0;pointer-events:none;
  padding:9px 10px 10px;border-radius:14px;background:rgba(3,28,52,.30);border:1px solid rgba(143,244,255,.20);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transform:translateY(-8px);transition:opacity .9s,transform .9s cubic-bezier(.2,.7,.2,1)}
#next.on{opacity:1;transform:none}
#next .d{font-family:'Share Tech Mono',monospace;color:var(--hud);font-size:10px;letter-spacing:.12em;white-space:nowrap;text-transform:uppercase}
#next p{margin-top:5px;font-family:Unbounded,sans-serif;font-weight:300;font-size:11.5px;line-height:1.4;color:#fff;text-shadow:0 1px 8px rgba(0,20,40,.6)}
#hint{position:absolute;left:50%;bottom:calc(var(--gb) + 70px);transform:translateX(-50%);white-space:nowrap;padding:8px 16px;border-radius:20px;background:rgba(3,28,52,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(143,244,255,.25);font:11px 'Share Tech Mono',monospace;letter-spacing:.24em;color:var(--hud);opacity:0;transition:opacity .8s;pointer-events:none;text-shadow:0 0 10px rgba(0,30,60,.8)}
#hint small{display:block;margin-top:4px;font-size:9px;letter-spacing:.2em;color:var(--hud-dim)}
#hint.on{opacity:1;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,5px)}}

#warn{position:absolute;left:0;right:0;top:31%;text-align:center;pointer-events:none;opacity:0;transform:scale(.92);transition:opacity .35s,transform .35s}
#warn.on{opacity:1;transform:none}
#warn b{display:inline-block;font:15px 'Share Tech Mono',monospace;letter-spacing:.24em;color:#ffcf5a;padding:10px 18px;border:1px solid rgba(255,207,90,.7);border-radius:10px;background:rgba(40,22,0,.35);
  text-shadow:0 0 12px rgba(255,190,60,.7);box-shadow:0 0 24px rgba(255,190,60,.25);animation:blink 1s steps(2,start) infinite}
#warn small{display:block;margin-top:9px;font:11px Manrope,sans-serif;letter-spacing:.16em;color:#fff;text-shadow:0 1px 8px rgba(0,20,40,.8);text-transform:uppercase}
@keyframes blink{50%{border-color:rgba(255,207,90,.25)}}
body.diving #title{opacity:0;transform:translateY(-50%) scale(1.25);filter:blur(6px)}
body.diving #cta{opacity:0}
</style>
</head>
<body>
<div id="app">
  <video id="vid" src="img/surface.mp4" muted loop playsinline autoplay preload="auto"></video>
  <video id="vid2" src="img/reef5.mp4" muted loop playsinline preload="auto"></video>
  <video id="vid3" src="img/turtle12.mp4" muted loop playsinline preload="auto"></video>
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>

  <div id="title">
    <h1>ПОГРУЖЕНИЕ</h1>
    <p>дайв-центр</p>
    <div class="line"></div>
  </div>
  <div id="cta"><div class="ring"><i></i></div><span>Коснись, чтобы нырнуть</span></div>

  <div id="next">
    <div class="d" id="ptag">Пробный дайв</div>
    <p id="ptxt">Мир становится тише, а&nbsp;краски — ярче</p>
  </div>
  <div id="hint"><span id="hnext">↓ ГЛУБЖЕ · 12 М</span><small id="hup">↑ свайп вверх — всплыть</small></div>
  <div id="warn"><b>РУКАМИ НЕ ТРОГАТЬ</b><small>смотри — но не касайся</small></div>

  <div id="shade"></div>
  <svg id="mask"></svg>

  <div class="hud" id="depth"><div class="v"><span id="dv">0.0</span><small>м</small></div><div class="lbl">глубина</div></div>
  <div class="hud" id="air">
    <svg viewBox="0 0 78 78"><circle cx="39" cy="39" r="34" fill="none" stroke="rgba(143,244,255,.15)" stroke-width="2"/>
      <circle id="arc" cx="39" cy="39" r="34" fill="none" stroke="#8ff4ff" stroke-width="2" stroke-linecap="round" transform="rotate(-90 39 39)" stroke-dasharray="213.6" stroke-dashoffset="0"/></svg>
    <div class="num"><b id="av">200</b><i>BAR</i></div>
    <div class="lbl">воздух</div>
  </div>
  <div id="scale"><div class="rail"></div></div>
  <div class="hud" id="stats">
    <div><div class="v">27°C</div><div class="lbl">вода</div></div>
    <div class="r"><div class="v" id="tv">0:00</div><div class="lbl">время</div></div>
  </div>
  <div id="demo">демо · Kozak Studio</div>
</div>

<script>
(()=>{
const tg = window.Telegram && Telegram.WebApp;
const root = document.documentElement, body = document.body;
const app = document.getElementById('app'), vid = document.getElementById('vid'), vid2 = document.getElementById('vid2'), vid3 = document.getElementById('vid3');
const glc = document.getElementById('gl'), fx = document.getElementById('fx'), ctx = fx.getContext('2d');
const maskSvg = document.getElementById('mask');
let W=0,H=0,DPR=1;

/* ---------- Telegram ---------- */
function insets(){
  let top=0,bot=0;
  if(tg){
    const s=tg.safeAreaInset||{}, c=tg.contentSafeAreaInset||{};
    top=(s.top||0)+(c.top||0); bot=(s.bottom||0)+(c.bottom||0);
  }
  root.style.setProperty('--top',top+'px'); root.style.setProperty('--bot',bot+'px');
  return {top,bot};
}
if(tg){ try{ tg.ready(); tg.expand(); tg.requestFullscreen && tg.requestFullscreen(); tg.disableVerticalSwipes && tg.disableVerticalSwipes();
  tg.setHeaderColor && tg.setHeaderColor('#03172b'); tg.setBackgroundColor && tg.setBackgroundColor('#03172b');
  ['safeAreaChanged','contentSafeAreaChanged','viewportChanged','fullscreenChanged'].forEach(e=>tg.onEvent(e,layout)); }catch(e){} }
const VIB={light:22,medium:40,heavy:60};
const haptic=(t)=>{
  try{ tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t);}catch(e){}
  try{ navigator.vibrate && navigator.vibrate(VIB[t]||15); }catch(e){} // direct vibration: works even when system haptics are off
};

/* ---------- mask (glass) ---------- */
let glass={x:0,y:0,b:0};
function layout(){
  W=app.clientWidth; H=app.clientHeight; DPR=Math.min(window.devicePixelRatio||1,2);
  const {top,bot}=insets();
  const envTop = parseFloat(getComputedStyle(root).getPropertyValue('--envtop'))||0;
  const gx=12, gy=Math.max(top, 14)+6, gb=Math.max(bot,14)+18;
  glass={x:gx,y:gy,b:gb};
  root.style.setProperty('--gx',gx+'px'); root.style.setProperty('--gy',gy+'px'); root.style.setProperty('--gb',gb+'px');
  [fx,glc].forEach(c=>{c.width=W*DPR;c.height=H*DPR;});
  drawMask(); buildScale(); fitPlate();
}
function drawMask(){
  const x0=glass.x, y0=glass.y, x1=W-glass.x, y1=H-glass.b, r=Math.min(58,W*.14);
  const cx=W/2, nw=Math.min(150,W*.36), nh=46; // nose pocket
  const glassPath=`M${x0+r},${y0} H${x1-r} Q${x1},${y0} ${x1},${y0+r} V${y1-r} Q${x1},${y1} ${x1-r},${y1}
    H${cx+nw/2+24} C${cx+nw/2},${y1} ${cx+nw/2},${y1-nh} ${cx},${y1-nh} C${cx-nw/2},${y1-nh} ${cx-nw/2},${y1} ${cx-nw/2-24},${y1}
    H${x0+r} Q${x0},${y1} ${x0},${y1-r} V${y0+r} Q${x0},${y0} ${x0+r},${y0} Z`;
  maskSvg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  maskSvg.innerHTML=`
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="edge" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".22" stop-color="#fff" stop-opacity=".03"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset=".78" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="drop" cx=".38" cy=".35" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="#fff" stop-opacity=".08"/><stop offset=".8" stop-color="#002" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".25"/></radialGradient>
    <clipPath id="gclip"><path d="${glassPath}"/></clipPath>
  </defs>
  <g clip-path="url(#gclip)">
    <path d="${glassPath}" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="60" filter="url(#edge)"/>
    <path d="M${x0},${y0+H*.18} L${x0+W*.55},${y0} L${x0+W*.7},${y0} L${x0},${y0+H*.3} Z" fill="url(#glare)"/>
    ${drops()}
  </g>
  <path fill-rule="evenodd" fill="#050b10" d="M-2,-2 H${W+2} V${H+2} H-2 Z ${glassPath}"/>
  <path d="${glassPath}" fill="none" stroke="#1c2a33" stroke-width="3"/>
  <path d="${glassPath}" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="1" transform="translate(0,1.5)"/>`;
}
function drops(){
  const pts=[[.86,.2,3],[.89,.225,1.6],[.93,.5,2]]; // tiny drops near the glass edge only
  return pts.map(([u,v,s])=>`<ellipse cx="${u*W}" cy="${v*H}" rx="${s}" ry="${s*1.15}" fill="url(#drop)"/>`).join('');
}
const STOPS=[0,5,12,18,30];
let scaleEl=document.getElementById('scale'), markEl;
function buildScale(){
  scaleEl.innerHTML='<div class="rail"></div>'+STOPS.map(d=>`<div class="tick" style="top:${d/30*100}%">${d}</div>`).join('')+'<div class="mark" id="mk"></div>';
  markEl=document.getElementById('mk'); setDepth(state.depth);
}

/* ---------- WebGL water ---------- */
let gl=null, prog, tex, tex2, U={}, glOK=false;
function initGL(){
  try{
    gl=glc.getContext('webgl',{premultipliedAlpha:false,antialias:false});
    if(!gl) return;
    const vs=`attribute vec2 p;varying vec2 uv;void main(){uv=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}`;
    const fs=`precision mediump float;varying vec2 uv;uniform sampler2D t,t2;uniform vec2 res,vr,vr2;uniform float tm,sub,tapT,mx,dk;uniform vec2 tap;
    void main(){
      vec2 q=uv; vec2 px=uv*res;
      float hl=0.;
      if(tapT>=0.){
        vec2 d=px-tap; float r=length(d); vec2 n=d/(r+1e-3);
        for(int i=0;i<3;i++){
          float ti=tapT-float(i)*.22; if(ti<0.) continue;
          float front=ti*620.; float w=exp(-pow((r-front)/(70.+ti*60.),2.));
          float amp=(26.-float(i)*6.)*exp(-ti*1.2);
          float s=sin((r-front)*.075);
          q+=n*s*amp*w/res; hl+=max(s,0.)*w*exp(-ti*1.6)*(.5-float(i)*.12);
        }
      }
      q+=vec2(sin(q.y*16.+tm*1.9),cos(q.x*13.+tm*1.6))*.007*sub;
      float sa=res.x/res.y, va=vr.x/vr.y;
      vec2 sc= sa>va? vec2(1.,va/sa) : vec2(sa/va,1.);
      vec2 tq=(q-.5)*sc/1.03+.5;
      vec3 c=texture2D(t,clamp(tq,0.,1.)).rgb;
      c+=hl*vec3(.75,.95,1.);
      vec3 deep=mix(vec3(.05,.33,.5),vec3(.01,.08,.18),uv.y);
      float lum=dot(c,vec3(.3,.5,.2));
      c=mix(c, deep+lum*vec3(.05,.18,.22), sub*.88);
      if(mx>0.){
        vec2 q2=uv+vec2(sin(uv.y*16.+tm*1.9),cos(uv.x*13.+tm*1.6))*.008*(1.-mx);
        float va2=vr2.x/vr2.y; vec2 sc2= sa>va2? vec2(1.,va2/sa) : vec2(sa/va2,1.);
        vec3 c2=texture2D(t2,clamp((q2-.5)*sc2/1.02+.5,0.,1.)).rgb;
        c=mix(c,c2,mx);
      }
      float l2=dot(c,vec3(.3,.5,.2)); c=mix(c,vec3(.01,.07,.16)+l2*vec3(.04,.16,.22),dk);
      gl_FragColor=vec4(c,1.);
    }`;
    const sh=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s;};
    prog=gl.createProgram(); gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(prog); gl.useProgram(prog);
    const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    ['t','t2','res','vr','vr2','tm','sub','tapT','tap','mx','dk'].forEach(k=>U[k]=gl.getUniformLocation(prog,k));
    const mk=(unit)=>{ const x=gl.createTexture(); gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,x);
      [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE));
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,1,1,0,gl.RGB,gl.UNSIGNED_BYTE,new Uint8Array([3,23,43])); return x; };
    tex=mk(0); tex2=mk(1); gl.uniform1i(U.t,0); gl.uniform1i(U.t2,1);
  }catch(e){ gl=null; console.warn('gl off',e); }
}
function drawGL(now){
  if(!gl) return;
  if(slotA.readyState<2) return;
  try{
    if(state.mx<1){ gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,slotA); }
    if(state.mx>0&&slotB.readyState>=2){ gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,tex2); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,slotB); }
  }
  catch(e){ gl=null; glc.style.display='none'; return; }   // e.g. file:// security
  if(!glOK){ glOK=true; glc.style.display='block'; vid2.style.opacity='1'; vid3.style.opacity='1'; } // canvas covers it; visible video keeps Android decoding
  gl.viewport(0,0,glc.width,glc.height);
  gl.uniform2f(U.res,W,H); gl.uniform2f(U.vr,slotA.videoWidth||1080,slotA.videoHeight||1920); gl.uniform2f(U.vr2,slotB.videoWidth||1080,slotB.videoHeight||1920); gl.uniform1f(U.mx,state.mx); gl.uniform1f(U.dk,state.dk);
  gl.uniform1f(U.tm,now/1000); gl.uniform1f(U.sub,state.sub);
  gl.uniform1f(U.tapT,state.tapAt?(now-state.tapAt)/1000:-1); gl.uniform2f(U.tap,state.tapX,state.tapY);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

/* ---------- state & dive ---------- */
const SCENES=[
  {v:vid, depth:0},
  {v:vid2, depth:5,  tag:'Пробный дайв', txt:'Мир становится тише, а&nbsp;краски — ярче'},
  {v:vid3, depth:12, tag:'Open Water',   txt:'Синева густеет. Ты — гость рифа', warn:[2.15,4.7]},
];
const NEXT_LABEL={1:'↓ ГЛУБЖЕ · 12 М',2:'↓ ГЛУБЖЕ · 18 М'};
let slotA=vid, slotB=vid2;
const state={mode:'surface',cur:0,dk:0,sub:0,mx:0,depth:0,air:200,tapAt:0,tapX:0,tapY:0,diveAt:0,diveStart:0};
const dv=document.getElementById('dv'), av=document.getElementById('av'), tv=document.getElementById('tv'), arc=document.getElementById('arc');
const depthEl=document.getElementById('depth'), airEl=document.getElementById('air'), plateEl=document.getElementById('next');
function fitPlate(){ // keep the top plate exactly between depth gauge and air ring
  const L=depthEl.getBoundingClientRect().right+8, Rr=W-airEl.getBoundingClientRect().left+8;
  plateEl.style.left=L+'px'; plateEl.style.right=Rr+'px';
}
let dlen=0;
function setDepth(d){ const s=d.toFixed(1); dv.textContent=s; if(s.length!==dlen){ dlen=s.length; fitPlate(); } if(markEl) markEl.style.top=(d/30*100)+'%'; }
function setAir(a){ state.air=a; av.textContent=Math.round(a); arc.setAttribute('stroke-dashoffset',(213.6*(1-a/200)).toFixed(1)); }
let lastMeter=0;

const bubbles=[];
function spawn(n,x,y,spread){ for(let i=0;i<n;i++) bubbles.push({x:x+(Math.random()-.5)*spread,y:y+Math.random()*spread*.6,r:1.5+Math.random()*Math.random()*9,vy:.6+Math.random()*1.6,ph:Math.random()*6,life:1}); }

function dive(x,y){
  if(state.mode!=='surface') return;
  state.mode='diving'; state.tapAt=performance.now(); state.tapX=x; state.tapY=y; state.diveStart=state.tapAt;
  body.classList.add('diving'); haptic('medium'); slotA=vid; slotB=vid2; state.cur=1; vid2.currentTime=0; vid2.play().catch(()=>{});
  if(!glOK) cssRipple(x,y);
}
function cssRipple(x,y){ // fallback when WebGL is unavailable
  for(let i=0;i<3;i++){ const d=document.createElement('div');
    d.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:20px;height:20px;margin:-10px;border-radius:50%;border:2px solid rgba(255,255,255,.7);pointer-events:none;transition:transform 1.6s ease-out,opacity 1.6s;transition-delay:${i*.2}s`;
    app.insertBefore(d,fx); requestAnimationFrame(()=>requestAnimationFrame(()=>{d.style.transform='scale(40)';d.style.opacity='0';})); setTimeout(()=>d.remove(),2400); }
}
function surface(){
  state.mode='rising'; state.riseAt=performance.now(); haptic('light');
  state.riseFrom=SCENES[state.cur].depth; slotA=vid; slotB=SCENES[state.cur].v; state.mx=1; state.sub=1; state.dk=0;
  hideUI();
}
function hideUI(){ document.getElementById('next').classList.remove('on'); document.getElementById('hint').classList.remove('on'); document.getElementById('warn').classList.remove('on'); }
function showUI(i){
  const s=SCENES[i]; document.getElementById('ptag').innerHTML=s.tag; document.getElementById('ptxt').innerHTML=s.txt;
  document.getElementById('hnext').textContent=NEXT_LABEL[i]||'';
  document.getElementById('hup').textContent= i>1 ? '↑ свайп вверх — выше' : '↑ свайп вверх — всплыть';
  document.getElementById('next').classList.add('on');
  setTimeout(()=>state.mode==='down'&&state.cur===i&&document.getElementById('hint').classList.add('on'),900);
}
function move(to){ // swim between levels
  const from=state.cur; state.mode='move'; state.mv={from,to,at:performance.now(),air:state.air,started:false};
  slotA=SCENES[from].v; slotB=SCENES[to].v; state.mx=0; state.sub=0; hideUI(); haptic('medium');
}
// swipes: up = shallower / surface, down = deeper
let sy=null;
app.addEventListener('pointerdown',e=>{sy=e.clientY;},true);
app.addEventListener('pointerup',e=>{ if(sy===null||state.mode!=='down') return; const dy=e.clientY-sy; sy=null;
  if(dy<-60){ if(state.cur>1) move(state.cur-1); else surface(); }
  else if(dy>60 && SCENES[state.cur+1]) move(state.cur+1);
  else if(dy>60){ const hn=document.getElementById('hint'); haptic('light'); hn.animate([{transform:'translate(-50%,0)'},{transform:'translate(-50%,10px)'},{transform:'translate(-50%,0)'}],{duration:400}); }
},true);
app.addEventListener('pointerdown',e=>{ if(e.target.closest('button')) return; dive(e.clientX,e.clientY); });

const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
function tick(now){
  const T=state.tapAt?(now-state.tapAt)/1000:0;
  if(state.mode==='diving'){
    state.sub=ease((T-.45)/1.2); state.mx=ease((T-1.5)/1.3);
    const dd=ease((T-.7)/2.4)*5; setDepth(dd);
    if(Math.floor(dd)>lastMeter){ lastMeter=Math.floor(dd); haptic('light'); }
    setAir(200-ease((T-.7)/2.4)*2);
    if(T>.55&&T<1.6) spawn(3,W/2,H*.9,W*.9);
    if(T>3.1){ state.mode='down'; slotA=vid2; state.mx=0; state.sub=0; showUI(1); }
  } else if(state.mode==='move'){
    const m=state.mv, P=(now-m.at)/2400, a=SCENES[m.from].depth, b=SCENES[m.to].depth;
    if(!m.started && P>.45){ m.started=true; slotB.currentTime=0; slotB.play().catch(()=>{}); }
    state.dk=Math.sin(Math.PI*Math.min(Math.max(P,0),1))*.62; state.mx=ease((P-.3)/.4);
    const dd=a+(b-a)*ease(P); setDepth(dd);
    const mtr=Math.floor(dd); if(mtr!==lastMeter){ lastMeter=mtr; haptic('light'); }
    setAir(m.air-ease(P)*(b>a?3:1));
    if(P<.55&&Math.random()<.35) spawn(1,W*(.3+Math.random()*.4),H*.85,40);
    if(P>=1){ state.mode='down'; state.cur=m.to; state.dk=0; state.mx=0; slotA=slotB; SCENES.forEach(s=>{ if(s.v!==slotA&&s.v!==vid) s.v.pause(); }); showUI(m.to); }
  } else if(state.mode==='rising'){
    const R=(now-state.riseAt)/1000, k=1-ease(R/1.4);
    state.sub=Math.min(state.sub,k); state.mx=Math.min(state.mx,1-ease(R/.8)); setDepth(Math.min(parseFloat(dv.textContent),state.riseFrom*k));
    if(R<.9&&Math.random()<.5) spawn(2,Math.random()*W,H,30);
    if(R>1.5){ state.mode='surface'; state.tapAt=0; state.sub=0; state.mx=0; state.cur=0; slotA=vid; slotB=vid2; vid2.pause(); vid3.pause(); lastMeter=0; setDepth(0); setAir(200); tv.textContent='0:00'; body.classList.remove('diving'); }
  }
  if(state.mode!=='surface') { const s=Math.max(0,Math.floor((now-state.diveStart)/1000)); tv.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
  if(!glOK){ vid2.style.opacity=vid3.style.opacity=.01; if(slotA!==vid) slotA.style.opacity=1; if(slotB!==vid) slotB.style.opacity=Math.max(state.mx,slotB===slotA?1:.01); }
  const live = state.mode==='move' ? (state.mv.started?slotB:null) : (state.mode==='down'||state.mode==='diving') ? (state.mode==='diving'?slotB:slotA) : null;
  if(live&&live.paused&&now-(state.kick||0)>500){ state.kick=now; live.play().catch(()=>{}); }
  // "hands off" warning on the turtle scene, synced to the hand in the video
  const sc=SCENES[state.cur], w=document.getElementById('warn');
  const on= state.mode==='down' && sc.warn && sc.v.currentTime>sc.warn[0] && sc.v.currentTime<sc.warn[1];
  if(on && !w.classList.contains('on')){ w.classList.add('on'); try{ tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred('warning'); }catch(e){} try{ navigator.vibrate&&navigator.vibrate([50,70,50]); }catch(e){} }
  else if(!on && w.classList.contains('on')) w.classList.remove('on');
  if(state.mode==='surface'&&vid.paused&&now-(state.kick||0)>1000){ state.kick=now; vid.play().catch(()=>{}); }
  drawFX(T);
  drawGL(now);
  requestAnimationFrame(tick);
}

/* waterline rushing up the glass + bubbles */
function drawFX(T){
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  if(state.mode==='diving'&&T>.35&&T<1.4){
    const k=ease((T-.35)/.85), yl=H*(1.08-k*1.25);
    ctx.beginPath(); ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=8){ ctx.lineTo(x, yl+Math.sin(x*.025+T*9)*10+Math.sin(x*.06-T*5)*5); }
    ctx.lineTo(W,H); ctx.closePath();
    const g=ctx.createLinearGradient(0,yl-20,0,yl+H*.5);
    g.addColorStop(0,'rgba(200,250,255,.55)'); g.addColorStop(.04,'rgba(60,170,210,.35)'); g.addColorStop(1,'rgba(5,40,80,.25)');
    ctx.fillStyle=g; ctx.globalAlpha=1-ease((T-1.1)/.3); ctx.fill(); ctx.globalAlpha=1;
  }
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i]; b.y-=b.vy*(1+b.r*.12); b.x+=Math.sin(b.y*.03+b.ph)*.6;
    if(b.y<-20){ bubbles.splice(i,1); continue; }
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7);
    ctx.strokeStyle='rgba(220,250,255,.55)'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='rgba(180,240,255,.08)'; ctx.fill();
    ctx.beginPath(); ctx.arc(b.x-b.r*.35,b.y-b.r*.35,b.r*.28,0,7); ctx.fillStyle='rgba(255,255,255,.7)'; ctx.fill();
  }
}

window.addEventListener('resize',layout);
layout(); initGL();
vid.play().catch(()=>{ app.addEventListener('pointerdown',()=>vid.play(),{once:true}); });
requestAnimationFrame(tick);

/* ---------- auto-update: check version.txt every minute, reload only on the surface ---------- */
const BUILD='20261029-1415';
let pendingVer=null;
async function checkVer(){
  try{
    const r=await fetch('version.txt?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    const v=(await r.text()).trim();
    if(v && v!==BUILD) pendingVer=v;
  }catch(e){}
}
function tryReload(){
  if(pendingVer && state.mode==='surface'){
    location.replace(location.pathname+'?v='+encodeURIComponent(pendingVer)+location.hash); // hash keeps Telegram launch data
  }
}
setTimeout(checkVer,2000); setInterval(checkVer,60000); setInterval(tryReload,1000);
})();
</script>
